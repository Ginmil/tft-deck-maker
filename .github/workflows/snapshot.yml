# Community Dragon 세트 데이터 사본(data/set-snapshot.json)을 갱신합니다.
# 사이트는 처음 열 때 이 사본을 쓰므로 Community Dragon 서버 장애에도 동작해요. 라이엇 API 키는 필요 없어요.
name: 세트 데이터 사본 갱신

on:
  # 11/24 세트 18 고정: 매일 갱신·푸시 시 갱신을 끔 (Community Dragon latest 가 12/1 부터 세트 19). 필요하면 수동 실행
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # 11/27 사용자: 세트 19 시작(12/1) 전에 수집을 완전히 막음 — 수동 실행해도 건너뜀. 다시 쓰려면 이 줄을 지움
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 사본 만들기
        run: node tools/snapshot-set.mjs
      - name: 게임 팀 코드 번호 (실패해도 사본은 커밋)
        run: node tools/planner-codes.mjs
        continue-on-error: true
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/set-snapshot.json data/icons; [ -f data/planner-codes.json ] && git add data/planner-codes.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "세트 데이터 사본 갱신: $(date -u +'%Y-%m-%d')"
          git pull --rebase -q origin main
          git push

name: peek-traits (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache/restore@v4
        with: { path: tools/cache, key: matches-none, restore-keys: matches- }
      - run: |
          for t in DA_18_Elderwood DA_18_Brawler DA_18_Executioner DA_18_Rapidfire; do node tools/peek-traits.mjs $t; done

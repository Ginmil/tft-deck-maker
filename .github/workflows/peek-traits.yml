name: peek-traits (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://raw.communitydragon.org/latest/cdragon/tft/ko_kr.json -o ko.json
          jq -r '.items[] | select((.apiName // "") | test("^DA_|TFT18|Set18"; "i")) | select((.apiName // "") | test("Elderwood|Brawler|Executioner|Rapidfire|Heart|Crown|Soul|Trait"; "i")) | "\(.apiName)\t\(.name)\t\((.desc // "") | gsub("\n";" ") | .[0:160])\t\(.effects // {} | tostring | .[0:120])"' ko.json | head -80

name: peek-traits (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://raw.communitydragon.org/latest/cdragon/tft/ko_kr.json -o ko.json
          echo "== 이름에 중도·골동품"
          jq -r '.. | objects | select(has("name") and (.name|type=="string")) | select(.name|test("중도|골동품")) | "\(.apiName)\t\(.name)\t\((.desc // "") | tostring | gsub("\n";" ") | .[0:260])"' ko.json | head
          echo "== apiName 에 Wisp/Spirit/Guardian"
          jq -r '.. | objects | select(has("apiName") and (.apiName|type=="string")) | select(.apiName|test("Wisp|Spirit|Guardian|Shrine|Altar"; "i")) | select(.apiName|test("^DA_|18"; "i")) | "\(.apiName)\t\(.name)\t\((.desc // "") | tostring | gsub("\n";" ") | .[0:200])"' ko.json | head -60

name: peek-traits (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache/restore@v4
        with:
          path: tools/cache
          key: matches-none
          restore-keys: matches-
      - run: |
          curl -sL https://raw.communitydragon.org/latest/cdragon/tft/ko_kr.json -o ko.json
          node tools/peek-traits.mjs DA_18_Elderwood
          node tools/peek-traits.mjs DA_18_Brawler

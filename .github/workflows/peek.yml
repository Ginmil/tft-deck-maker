name: peek (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.communitydragon.org/latest/game/characters
          for c in da_18_ornn da_18_alistar; do
            for f in $c/$c.cdtb.bin.json $c/$c.bin.json; do curl -sSL -o x.json -w "$f %{http_code} %{size_download}\n" $B/$f; grep -io '"[a-z_]*planner[a-z_]*"[^,]*' x.json | head; grep -o '[^,{]*: *105[5]\b[^,]*' x.json | head -3; grep -o '[^,{]*: *1081\b[^,]*' x.json | head -3; done
          done
          curl -sSL -o idx.html $B/da_18_ornn/; grep -o 'href="[^"]*"' idx.html | head -20

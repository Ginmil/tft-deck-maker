# 임시: 나무정령 식물 그림 찾기
name: 스킬 정보 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.communitydragon.org/latest/game
          for n in ironbarktree liferoot brock maokaisapling sentinel; do
            echo "== $n"; curl -sL $B/characters/tft18_$n.cdtb.bin.json | grep -oiE '"[^"]*(icon|square|circle|portrait|splash)[^"]*\.(tex|png|dds)"' | sort -u | head -8
            curl -sL $B/characters/tft18_$n.cdtb.bin.json | grep -oiE '"(mCharacterName|name|mDisplayName[^"]*)":"[^"]*"' | head -3
            curl -sL $B/assets/characters/tft18_$n/hud/ | grep -oiE 'href="[^"]*\.png"' | head -6
          done

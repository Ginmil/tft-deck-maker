# 임시: 캐시된 경기 한 판의 필드 확인 (배치 위치 정보가 있는지)
name: 경기 필드 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: tools/cache
          key: matches-none
          restore-keys: matches-
      - run: |
          f=$(ls tools/cache/*.json | head -1)
          node -e "const m=require('./'+process.argv[1]); const p=m.info.participants[0]; console.log('INFO', Object.keys(m.info)); console.log('PART', Object.keys(p)); console.log('UNIT', JSON.stringify(p.units[0])); console.log('ALLUNITKEYS', [...new Set(m.info.participants.flatMap(q=>q.units.flatMap(u=>Object.keys(u))))])" "$f"

# 임시: 게임 데이터(bin) 위치 찾기
name: 스킬 정보 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://raw.communitydragon.org/latest/game/characters/ | grep -oiE 'href="[^"]*khazix[^"]*"' | head
          curl -sL https://raw.communitydragon.org/latest/game/data/characters/ | grep -oiE 'href="[^"]*(khazix|18_)[^"]*"' | head -20

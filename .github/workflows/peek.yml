name: peek (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://raw.communitydragon.org/latest/game/data/maps/shipping/map22/map22.bin.json
          curl -sSL -o m.json -w "%{http_code} %{size_download}\n" $U
          jq -c '.["{9755618b}"]' m.json | head -c 2000; echo
          jq -c 'to_entries | map(select(.value.__type=="TftShopData")) | length' m.json
          jq -c 'to_entries | map(select((.value.__type // "")|test("Shop"))) | .[0:2]' m.json | head -c 2000; echo

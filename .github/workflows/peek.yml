# 임시: 스킬 수치 구조 확인
name: 스킬 정보 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://raw.communitydragon.org/latest/game/characters/da_18_khazix.cdtb.bin.json -o k.json
          node -e "
          const d=require('./k.json'); console.log('NKEYS', Object.keys(d).length);
          for (const [k,v] of Object.entries(d)) { const s=JSON.stringify(v); if (/DataValues|SpellCalculations/.test(s)) console.log('OBJ', k, v.__type, s.slice(0,5000)); }
          for (const [k,v] of Object.entries(d)) if (/Record|CharacterRecord/i.test(v.__type||'')) console.log('REC', k, JSON.stringify(v).slice(0,800));
          "

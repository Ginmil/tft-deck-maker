# 임시: 스킬 수치가 있는 다른 게임 데이터 파일 찾기
name: 스킬 정보 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.communitydragon.org/latest/game
          curl -sL $B/data/maps/shipping/ | grep -oE 'href="[^"]*"' | head -40
          curl -sL $B/data/maps/shipping/map22/ | grep -oE 'href="[^"]*"' | head -40
          curl -sL $B/characters/ | grep -oiE 'href="[^"]*khazix[^"]*"'
          for f in data/maps/shipping/map22/map22.bin.json; do curl -sL -o m.json -w "$f %{http_code} %{size_download}\n" $B/$f; done
          grep -o 'MagicDamageCalc1[^]]\{0,40\}' m.json | head -5 || true
          node -e "const s=require('fs').readFileSync('m.json','utf8'); let i=s.indexOf('KhaZix'); let n=0; while(i>=0 && n<6){ console.log('HIT', s.slice(Math.max(0,i-200), i+600).replace(/\s+/g,' ')); i=s.indexOf('KhaZix', i+1000); n++; }" || true

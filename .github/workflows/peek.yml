name: peek (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.communitydragon.org/latest/game/characters
          for c in da_18_ornn da_18_alistar da_18_ezreal; do
            curl -sSL -o x.json -w "$c %{http_code} %{size_download}\n" $B/$c.cdtb.bin.json
            grep -io '"[a-z_]*planner[a-z_]*"[^,]*' x.json | head
            grep -oE '"[^"]+": *(1055|1081|1072)[,}]' x.json | head -5
          done

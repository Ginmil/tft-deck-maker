# 임시: 나무정령 식물 이미지 찾기
name: 스킬 정보 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.communitydragon.org/latest/game
          curl -sL $B/characters/ | grep -oiE 'href="[^"]*(elderwood|bark|flower|bloom|guardian|plant|tree|sprout|lunar|moon)[^"]*"' | head -40
          curl -sL $B/assets/characters/ | grep -oiE 'href="[^"]*(elderwood|bark|flower|bloom|guardian|plant|tree|sprout|lunar|moon)[^"]*"' | head -40
          curl -sL $B/assets/ux/tft/championsplashes/patching/ | grep -oiE 'href="[^"]*(elderwood|bark|flower|bloom|guardian|plant|tree|sprout)[^"]*"' | head -40

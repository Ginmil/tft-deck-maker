name: peek (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://raw.communitydragon.org/latest/game/data/maps/shipping/map22/map22.bin.json
          curl -sSL -o m.json $U
          python3 - <<'PY'
          import json,re
          s=open('m.json').read()
          for key in ['9755618b','DA_18_Ornn','eamPlanner','TeamPlanner']:
              idx=[m.start() for m in re.finditer(key,s)][:3]
              print('==',key,len(re.findall(key,s)))
              for i in idx: print('   ', s[max(0,i-300):i+500].replace('\n',' ')[:800])
          PY

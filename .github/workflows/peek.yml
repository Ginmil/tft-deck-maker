# 임시: 게임 데이터(bin)에서 스킬 수치 확인
name: 스킬 정보 확인
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in characters/tft18_khazix/tft18_khazix.bin.json characters/tft18_khazix.bin.json; do echo "TRY $u"; curl -sL -o k.json -w "%{http_code}\n" https://raw.communitydragon.org/latest/game/$u; head -c 300 k.json; echo; done
          node -e "
          const d=require('./k.json'); const keys=Object.keys(d); console.log('NKEYS', keys.length, keys.slice(0,15).join(' | '));
          for (const [k,v] of Object.entries(d)) { const s=JSON.stringify(v); if (/DataValues|mDataValues/.test(s) && /Spell/i.test(v.__type||'')) console.log('SPELL', k, s.slice(0,3500)); }
          " || true

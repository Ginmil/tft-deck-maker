name: peek (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/tftchampions.json -o c.json
          echo count $(jq length c.json); grep -o '"[a-z_A-Z]*[Pp]lanner[a-zA-Z_]*"' c.json | sort | uniq -c
          jq -c '[.[] | select(.character_record.character_id | test("^DA_18_(Ashe|Sivir)$"))]' c.json | head -c 1500; echo
          for i in 739 759 798 749 737 747 750 764; do jq -c ".[$i] | {i: $i, id: .character_record.character_id, n: .character_record.display_name, t: .team_planner_code}" c.json; done
          jq -c 'to_entries | map(select(.value.character_record.character_id | test("^DA_18_Ashe$|^DA_18_Sivir$|^DA_Lux18"))) | map({i: .key, id: .value.character_record.character_id})' c.json
          curl -sSL https://raw.communitydragon.org/latest/cdragon/tft/ko_kr.json -o ko.json
          grep -o '"[a-zA-Z_]*[Pp]lanner[a-zA-Z_]*"' ko.json | sort | uniq -c
          jq -c '[.setData[] | select(.mutator=="TFTSet18")][0].champions[] | select(.apiName|test("Ashe|Sivir")) ' ko.json | head -c 1200

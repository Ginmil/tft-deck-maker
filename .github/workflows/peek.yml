name: peek (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.communitydragon.org/latest/game/characters
          curl -sSL -o x.json $B/da_18_ornn.cdtb.bin.json
          jq -c 'to_entries[] | {k: .key, t: .value.__type, keys: (.value|keys)}' x.json | head -20
          jq -c 'to_entries[] | select(.value.__type=="TFTCharacterRecord" or (.key|test("CharacterRecords/Root"))) | .value' x.json | head -c 3000; echo
          grep -oE '[0-9]{4}' x.json | sort | uniq -c | sort -rn | head

# 매일 랭커 경기 통계를 수집해서 data/weights.json, data/weights.js 를 갱신하고 커밋합니다.
# 저장소 Settings → Secrets and variables → Actions 에 RIOT_API_KEY 를 등록해야 동작해요.
name: 랭커 통계 수집

on:
  # 11/24 세트 18 고정: 매일 자동 수집은 끔 (12/1 세트 19 시작 — 시연·최종보고서는 세트 18 기준). 수동 실행만, 세트 18 경기만 집계
  workflow_dispatch:         # Actions 탭에서 "Run workflow" 버튼으로 바로 실행
    inputs:
      max_players:
        description: '플레이어 수'
        default: '200'
      matches_per_player:
        description: '플레이어당 경기 수'
        default: '20'
      aggregate_only:
        description: '집계만 다시 (API 호출 없이 캐시된 경기로, 키 불필요)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # 11/27 사용자: 세트 19 시작(12/1) 전에 수집을 완전히 막음 — 수동 실행해도 건너뜀. 다시 쓰려면 이 줄을 지움
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 이미 받은 경기는 다시 받지 않도록 캐시 (호출 한도 절약)
      - uses: actions/cache@v4
        with:
          path: tools/cache
          key: matches-${{ github.run_id }}
          restore-keys: matches-

      - name: 통계 수집
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MAX_PLAYERS: ${{ inputs.max_players || '200' }}
          MATCHES_PER_PLAYER: ${{ inputs.matches_per_player || '20' }}
          AGGREGATE_ONLY: ${{ inputs.aggregate_only && '1' || '0' }}
        run: node tools/collect-stats.mjs

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/weights.json data/weights.js
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "통계 갱신: $(date -u +'%Y-%m-%d')"
          git pull --rebase -q origin main
          git push

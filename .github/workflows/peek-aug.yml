name: peek-aug (임시)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://raw.communitydragon.org/latest/cdragon/tft/ko_kr.json -o ko.json
          jq -r '.items[] | select(((.name // "") + (.desc // "")) | test("나무정령")) | "\(.apiName)\t\(.name)\t\((.desc // "") | gsub("\n";" ") | .[0:220])"' ko.json
